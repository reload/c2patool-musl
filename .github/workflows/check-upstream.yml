# Builds the newest upstream c2patool release once a day. For any other
# version, run "Build and release" by hand.
#
# Permissions: contents: read to check. The build job needs contents: write and
# issues: write, because a called workflow runs with its caller's permissions.

name: Check upstream

on:
  schedule:
    - cron: "40 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Compare upstream against this repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      needs_build: ${{ steps.compare.outputs.needs_build }}
      version: ${{ steps.compare.outputs.version }}
    steps:
      - name: Check out this repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Compare the newest upstream release against the newest release here
        id: compare
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          . ./scripts/config.sh

          # c2pa-rs also releases other crates, so filter by tag prefix.
          # gh api --jq takes one argument, so the filter runs in jq itself.
          UPSTREAM="$(gh api "repos/${UPSTREAM_REPO}/releases?per_page=100" \
            | jq -r --arg p "$TAG_PREFIX" '.[] | select(.draft == false) | select(.prerelease == false)
                  | select(.tag_name | startswith($p)) | .tag_name' \
            | sed "s/^${TAG_PREFIX}//" | sort -V | tail -n 1)"

          OURS="$(gh release list --limit 200 --json tagName,isDraft \
            --jq '.[] | select(.isDraft == false) | .tagName' \
            | sed "s/^${TAG_PREFIX}//" | sort -V | tail -n 1)"

          echo "Newest upstream release: ${UPSTREAM:-none}"
          echo "Newest release here:     ${OURS:-none}"

          if [ -z "$UPSTREAM" ]; then
            echo "::error::No upstream c2patool release was found. The API or the tag naming changed."
            exit 1
          fi

          NEWEST="$(printf '%s\n%s\n' "${OURS:-0.0.0}" "$UPSTREAM" | sort -V | tail -n 1)"
          if [ "$UPSTREAM" = "$OURS" ] || [ "$NEWEST" != "$UPSTREAM" ]; then
            # Equal versions are not enough: a release can lose an asset, and
            # a target added later leaves older releases short of one.
            MISSING="$(gh release view "$(tag_for "$OURS")" --json assets \
              | missing_assets "$OURS" | tr '\n' ' ')"
            if [ -n "${MISSING// /}" ]; then
              echo "::error::The newest release here, ${TAG_PREFIX}${OURS}, is missing assets: ${MISSING}"
              echo "::error::Run the build workflow by hand with force to rebuild it. That changes the published checksums."
              exit 1
            fi

            echo "Decision: nothing to do. Upstream ${UPSTREAM} is already published here with every asset."
            echo "needs_build=false" >> "$GITHUB_OUTPUT"
            SUMMARY="Nothing to do. Upstream is \`${UPSTREAM}\`, published here is \`${OURS:-none}\`, with every asset."
          else
            echo "Decision: build ${UPSTREAM}."
            echo "needs_build=true" >> "$GITHUB_OUTPUT"
            echo "version=${UPSTREAM}" >> "$GITHUB_OUTPUT"
            SUMMARY="Building \`${UPSTREAM}\`. Published here is \`${OURS:-none}\`."
          fi

          {
            echo "## Upstream check"
            echo ""
            echo "$SUMMARY"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build the new version
    needs: check
    if: needs.check.outputs.needs_build == 'true'
    permissions:
      contents: write
      issues: write
    uses: ./.github/workflows/build-release.yml
    with:
      version: ${{ needs.check.outputs.version }}

  report-failure:
    name: Report the failure
    needs: check
    # A failed build reports itself, so never report it twice.
    if: failure() && needs.check.result == 'failure' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    concurrency:
      group: report-failure
      cancel-in-progress: false
    steps:
      - name: Check out this repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/report-failure
        with:
          title: The daily upstream check failed
          what-failed: The daily upstream check failed
          token: ${{ github.token }}
