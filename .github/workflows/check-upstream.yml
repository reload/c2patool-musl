# Builds the newest c2patool release on crates.io once a day. For any other
# version, run "Build and release" by hand.
#
# crates.io, not GitHub, decides what is newest: it lists every release, whichever
# repository upstream tags it in. When crates.io is ahead and the upstream tag is
# missing, the check fails, so an upstream move can never go quiet.
#
# Permissions: contents: read to check. The build job needs contents: write and
# issues: write, because a called workflow runs with its caller's permissions.

name: Check upstream

on:
  schedule:
    - cron: "40 6 * * *"
  workflow_dispatch:
    inputs:
      pretend_version:
        description: "Test only: use this version instead of the one crates.io reports, for example 9.9.9"
        required: false
        default: ""
        type: string

permissions: {}

jobs:
  check:
    name: Compare upstream against this repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      needs_build: ${{ steps.compare.outputs.needs_build }}
      version: ${{ steps.compare.outputs.version }}
    steps:
      - name: Check out this repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compare the newest upstream release against the newest release here
        id: compare
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          # Through the environment, never interpolated: an input must not
          # become shell code.
          PRETEND_VERSION: ${{ inputs.pretend_version }}
        run: |
          set -euo pipefail
          . ./scripts/config.sh

          # max_stable_version skips pre-releases and yanked versions.
          CRATE="$(curl -fsS --retry 3 -H "User-Agent: ${CRATES_IO_USER_AGENT}" "$CRATES_IO_API")"
          if [ -n "$PRETEND_VERSION" ]; then
            UPSTREAM="$(normalize_version "$PRETEND_VERSION")"
            echo "::warning::Test run: pretending that crates.io reports ${UPSTREAM}."
          else
            UPSTREAM="$(jq -r '.crate.max_stable_version // empty' <<<"$CRATE")"
          fi

          OURS="$(gh release list --limit 200 --json tagName,isDraft \
            --jq '.[] | select(.isDraft == false) | .tagName' \
            | sed "s/^${RELEASE_TAG_PREFIX}//" | sort -V | tail -n 1)"

          echo "Newest version on crates.io: ${UPSTREAM:-none}"
          echo "Newest release here:         ${OURS:-none}"

          if ! printf '%s' "$UPSTREAM" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::crates.io reported '${UPSTREAM}', which is not a version number. The crates.io API changed."
            exit 1
          fi

          NEWEST="$(printf '%s\n%s\n' "${OURS:-0.0.0}" "$UPSTREAM" | sort -V | tail -n 1)"
          if [ "$UPSTREAM" = "$OURS" ] || [ "$NEWEST" != "$UPSTREAM" ]; then
            # Equal versions are not enough: a release can lose an asset, and
            # a target added later leaves older releases short of one.
            MISSING="$(gh release view "$(release_tag_for "$OURS")" --json assets \
              | missing_assets "$OURS" | tr '\n' ' ')"
            if [ -n "${MISSING// /}" ]; then
              echo "::error::The newest release here, $(release_tag_for "$OURS"), is missing assets: ${MISSING}"
              echo "::error::Run the build workflow by hand with force to rebuild it. That changes the published checksums."
              exit 1
            fi

            echo "Decision: nothing to do. ${UPSTREAM} is already published here with every asset."
            echo "needs_build=false" >> "$GITHUB_OUTPUT"
            SUMMARY="Nothing to do. crates.io has \`${UPSTREAM}\`, published here is \`${OURS:-none}\`, with every asset."
          else
            REPO="$(upstream_repo_for "$UPSTREAM")"
            TAG="$(upstream_tag_for "$UPSTREAM")"
            if gh api "repos/${REPO}/releases/tags/${TAG}" --jq .tag_name >/dev/null 2>&1; then
              echo "Decision: build ${UPSTREAM} from ${REPO} at ${TAG}."
              echo "needs_build=true" >> "$GITHUB_OUTPUT"
              echo "version=${UPSTREAM}" >> "$GITHUB_OUTPUT"
              SUMMARY="Building \`${UPSTREAM}\` from \`${REPO}\` at \`${TAG}\`. Published here is \`${OURS:-none}\`."
            else
              # crates.io can publish minutes before the GitHub release, so
              # a fresh version gets a day before this counts as a fault.
              CREATED="$(jq -r --arg v "$UPSTREAM" '.versions[]? | select(.num == $v) | .created_at' <<<"$CRATE")"
              AGE=""
              if [ -n "$CREATED" ]; then
                AGE=$(( ( $(date -u +%s) - $(date -u -d "$CREATED" +%s) ) / 3600 ))
              fi
              if [ -n "$AGE" ] && [ "$AGE" -lt 24 ]; then
                echo "::warning::crates.io published ${UPSTREAM} ${AGE} hours ago, and ${REPO} has no release tagged ${TAG} yet. It is left for the next run."
                echo "needs_build=false" >> "$GITHUB_OUTPUT"
                SUMMARY="Waiting. crates.io has \`${UPSTREAM}\`, but \`${REPO}\` has no release \`${TAG}\` yet."
              else
                echo "::error::crates.io has c2patool ${UPSTREAM}, but ${REPO} has no release tagged ${TAG}. Newest release here: ${OURS:-none}."
                echo "::error::Upstream may have moved its releases or changed its tag naming. Update the upstream settings in scripts/config.sh."
                exit 1
              fi
            fi
          fi

          {
            echo "## Upstream check"
            echo ""
            echo "$SUMMARY"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build the new version
    needs: check
    if: needs.check.outputs.needs_build == 'true'
    permissions:
      contents: write
      issues: write
    uses: ./.github/workflows/build-release.yml
    with:
      version: ${{ needs.check.outputs.version }}

  report-failure:
    name: Report the failure
    needs: check
    # A failed build reports itself, so never report it twice.
    if: failure() && needs.check.result == 'failure' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    concurrency:
      group: report-failure
      cancel-in-progress: false
    steps:
      - name: Check out this repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/report-failure
        with:
          title: The daily upstream check failed
          what-failed: The daily upstream check failed
          token: ${{ github.token }}
