# Looks for a newer upstream c2patool release once a day and builds it.
# Only the newest upstream release is built. To build any other version, run the
# "Build and release" workflow by hand.
#
# Permissions: the check job needs contents: read. The build job needs
# contents: write and issues: write, because a called workflow runs with the
# permissions of the job that calls it.

name: Check upstream

on:
  schedule:
    - cron: "40 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Compare upstream against this repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      needs_build: ${{ steps.compare.outputs.needs_build }}
      version: ${{ steps.compare.outputs.version }}
    steps:
      - name: Check out this repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Compare the newest upstream release against the newest release here
        id: compare
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          . ./scripts/config.sh

          # Upstream tags a c2patool release as c2patool-vX.Y.Z in the c2pa-rs
          # repository. The releases for the other crates are ignored.
          # gh api --jq takes one argument and cannot pass a variable, so the
          # filter runs in jq itself.
          UPSTREAM="$(gh api "repos/${UPSTREAM_REPO}/releases?per_page=100" \
            | jq -r --arg p "$TAG_PREFIX" '.[] | select(.draft == false) | select(.prerelease == false)
                  | select(.tag_name | startswith($p)) | .tag_name' \
            | sed "s/^${TAG_PREFIX}//" | sort -V | tail -n 1)"

          OURS="$(gh release list --limit 200 --json tagName,isDraft \
            --jq '.[] | select(.isDraft == false) | .tagName' \
            | sed "s/^${TAG_PREFIX}//" | sort -V | tail -n 1)"

          echo "Newest upstream release: ${UPSTREAM:-none}"
          echo "Newest release here:     ${OURS:-none}"

          if [ -z "$UPSTREAM" ]; then
            echo "::error::No upstream c2patool release was found. The API or the tag naming changed."
            exit 1
          fi

          NEWEST="$(printf '%s\n%s\n' "${OURS:-0.0.0}" "$UPSTREAM" | sort -V | tail -n 1)"
          if [ "$UPSTREAM" = "$OURS" ] || [ "$NEWEST" != "$UPSTREAM" ]; then
            echo "Decision: nothing to do. Upstream ${UPSTREAM} is already published here."
            echo "needs_build=false" >> "$GITHUB_OUTPUT"
            SUMMARY="Nothing to do. Upstream is \`${UPSTREAM}\`, published here is \`${OURS:-none}\`."
          else
            echo "Decision: build ${UPSTREAM}."
            echo "needs_build=true" >> "$GITHUB_OUTPUT"
            echo "version=${UPSTREAM}" >> "$GITHUB_OUTPUT"
            SUMMARY="Building \`${UPSTREAM}\`. Published here is \`${OURS:-none}\`."
          fi

          {
            echo "## Upstream check"
            echo ""
            echo "$SUMMARY"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build the new version
    needs: check
    if: needs.check.outputs.needs_build == 'true'
    permissions:
      contents: write
      issues: write
    uses: ./.github/workflows/build-release.yml
    with:
      version: ${{ needs.check.outputs.version }}

  report-failure:
    name: Report the failure
    needs: check
    # Only a failure of the check job is reported here. A failed build reports
    # itself, so one failure never opens two issues.
    if: failure() && needs.check.result == 'failure' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    concurrency:
      group: report-failure
      cancel-in-progress: false
    steps:
      - name: Check out this repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/report-failure
        with:
          title: The daily upstream check failed
          what-failed: The daily upstream check failed
          token: ${{ github.token }}
