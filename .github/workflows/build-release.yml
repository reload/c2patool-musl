# Builds one upstream c2patool version for every musl target and publishes it.
#
# Only the publish job can write. The build job compiles upstream source, so it
# runs read-only and publish never executes what it produced. Publish runs only
# on main, so a run on any other branch builds and tests without releasing.
#
# Releases are immutable: a published version is never rebuilt or changed.
#
# Permissions: contents: read to prepare and build. contents: write,
# id-token: write and attestations: write to publish and attest. issues: write
# to report a failure.

name: Build and release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Upstream c2patool version, for example 0.27.22"
        required: true
        type: string
  workflow_call:
    inputs:
      version:
        required: true
        type: string

permissions: {}

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Decide what to build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      matrix: ${{ steps.version.outputs.matrix }}
      skip: ${{ steps.release.outputs.skip }}
      age_hours: ${{ steps.upstream.outputs.age_hours }}
    steps:
      - name: Check out this repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the version input
        id: version
        env:
          # Through the environment, never interpolated: an input must not
          # become shell code.
          RAW_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          . ./scripts/config.sh
          V="$(normalize_version "$RAW_VERSION")"
          if ! printf '%s' "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'${RAW_VERSION}' is not a version number such as 0.27.22."
            exit 1
          fi
          {
            echo "version=${V}"
            echo "tag=$(release_tag_for "$V")"
            echo "matrix=$(matrix_json)"
          } >> "$GITHUB_OUTPUT"
          echo "Version ${V}, targets:"
          supported_targets

      - name: Make sure that the upstream release exists
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          . ./scripts/config.sh
          REPO="$(upstream_repo_for "$V")"
          TAG="$(upstream_tag_for "$V")"

          if ! PUBLISHED="$(gh api "repos/${REPO}/releases/tags/${TAG}" --jq .published_at 2>/dev/null)"; then
            echo "::error::${REPO} has no release tagged ${TAG}."
            exit 1
          fi

          AGE=$(( ( $(date -u +%s) - $(date -u -d "$PUBLISHED" +%s) ) / 3600 ))
          echo "age_hours=${AGE}" >> "$GITHUB_OUTPUT"
          echo "Upstream released ${TAG} at ${PUBLISHED}, ${AGE} hours ago."

      - name: Decide whether this version still needs a release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail

          # A read-only token sees published releases only.
          if gh release view "$TAG" --json tagName >/dev/null 2>&1; then
            echo "${TAG} is published. Nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect the files that upstream ships beside the binary
        if: steps.release.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          V: ${{ steps.version.outputs.version }}
        run: ./scripts/fetch-aux.sh "$V" aux

      - name: Keep them for the build jobs
        if: steps.release.outputs.skip != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aux
          path: aux/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build ${{ matrix.target }}
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Check out this repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job runs upstream build scripts. It must carry no credential.
          persist-credentials: false

      - name: Take the files that upstream ships beside the binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: aux
          path: aux

      - name: Build the static musl binary
        id: build
        env:
          TARGET: ${{ matrix.target }}
          AUX_DIR: aux
          V: ${{ needs.prepare.outputs.version }}
          AGE: ${{ needs.prepare.outputs.age_hours }}
        run: |
          set -uo pipefail
          mkdir -p dist

          # GitHub runs this step as `bash -e`, which `set -uo pipefail` does
          # not turn off, so $? on the next line is never reached.
          STATUS=0
          ./scripts/build.sh "$V" dist || STATUS=$?

          if [ "$STATUS" -eq 0 ]; then
            exit 0
          fi

          # 75 means crates.io lacks this version. Anything else is real.
          if [ "$STATUS" -ne 75 ]; then
            exit "$STATUS"
          fi

          if [ "$AGE" -ge 24 ]; then
            # A publish takes minutes. A day later, deferring hides a fault.
            echo "::error::${V} was released upstream ${AGE} hours ago, the tag build fails, and crates.io still does not have it."
            exit 1
          fi

          echo "::warning::${V} is not on crates.io yet. It is left for the next scheduled run."
          echo "deferred" > dist/DEFERRED
          rm -f dist/*.tar.gz dist/*.json

      - name: Test the binary in every target image
        if: hashFiles('dist/DEFERRED') == ''
        env:
          V: ${{ needs.prepare.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          . ./scripts/config.sh
          A="$(archive_for "$V" "$TARGET")"
          ./scripts/smoke-test.sh "dist/${A}" "$V"
          ( cd dist && sha256sum "$A" ) | sed 's/^/    /' >> "$GITHUB_STEP_SUMMARY"

      - name: Hand the result to the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish the release
    needs: [prepare, build]
    if: needs.prepare.outputs.skip != 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out this repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Collect every target
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: build-*
          path: dist
          merge-multiple: true

      - name: Stop here when the version was deferred
        id: deferred
        run: |
          set -euo pipefail
          if [ -f dist/DEFERRED ]; then
            echo "This version is not on crates.io yet. The next scheduled run takes it."
            echo "deferred=true" >> "$GITHUB_OUTPUT"
          else
            echo "deferred=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Assemble the release assets
        if: steps.deferred.outputs.deferred != 'true'
        env:
          V: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          . ./scripts/config.sh

          # A partial release would be worse than none.
          while read -r T; do
            A="$(archive_for "$V" "$T")"
            if [ ! -f "dist/${A}" ]; then
              echo "::error::${A} is missing. The build for ${T} produced nothing."
              exit 1
            fi
            cp "dist/${A}" "dist/$(latest_archive_for "$T")"
          done < <(supported_targets)

          ( cd dist && sha256sum c2patool-*.tar.gz > SHA256SUMS )
          cat dist/SHA256SUMS

          ./scripts/release-notes.sh "$V" dist > dist/release-notes.md

      # Before the release exists, so a failed attestation publishes nothing.
      - name: Attest the build provenance of the archives
        if: steps.deferred.outputs.deferred != 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/c2patool-*.tar.gz

      - name: Create the release
        if: steps.deferred.outputs.deferred != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          V: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          . ./scripts/config.sh

          ASSETS=(dist/SHA256SUMS)
          while read -r T; do
            ASSETS+=("dist/$(archive_for "$V" "$T")" "dist/$(latest_archive_for "$T")")
          done < <(supported_targets)

          # An older version must not move /releases/latest/download/ back.
          HIGHEST="$(gh release list --limit 200 --json tagName,isDraft \
            --jq '.[] | select(.isDraft == false) | .tagName' \
            | sed "s/^${RELEASE_TAG_PREFIX}//" | sort -V | tail -n 1)"
          if [ -z "$HIGHEST" ] || [ "$(printf '%s\n%s\n' "$HIGHEST" "$V" | sort -V | tail -n 1)" = "$V" ]; then
            LATEST=true
          else
            LATEST=false
          fi
          echo "Highest published version: ${HIGHEST:-none}. Mark as latest: ${LATEST}."

          # A run that died mid-upload leaves a draft, which has no consumers.
          # Only a token that can write sees drafts.
          ERR="$(mktemp)"
          if IS_DRAFT="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>"$ERR")"; then
            if [ "$IS_DRAFT" != "true" ]; then
              echo "::error::${TAG} is already published."
              exit 1
            fi
            echo "Replacing the leftover draft."
            gh release delete "$TAG" --yes
          elif ! grep -q 'release not found' "$ERR"; then
            cat "$ERR" >&2
            exit 1
          fi

          # gh uploads the assets to a draft and publishes it last, which
          # immutable releases require.
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file dist/release-notes.md \
            --latest="$LATEST" \
            "${ASSETS[@]}"

          echo "Published ${TAG}."

      - name: Read the release back and check it
        if: steps.deferred.outputs.deferred != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail

          # Uploads happen one at a time, so a failure can leave archives from
          # one build beside checksums from another.
          VERIFY="$(mktemp -d)"
          gh release download "$TAG" --pattern '*.tar.gz' --dir "$VERIFY"
          cp dist/SHA256SUMS "$VERIFY/"
          ( cd "$VERIFY" && sha256sum -c SHA256SUMS )
          echo "Every published asset matches the checksums in this release."

      - name: Write the run summary
        if: always()
        env:
          V: ${{ needs.prepare.outputs.version }}
        run: |
          set -uo pipefail
          {
            echo "## c2patool ${V}"
            echo ""
            if [ -f dist/DEFERRED ]; then
              echo "Deferred. crates.io does not have this version yet."
            elif [ -f dist/release-notes.md ]; then
              cat dist/release-notes.md
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  report-failure:
    name: Report the failure
    needs: [prepare, build, publish]
    if: failure() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    concurrency:
      group: report-failure
      cancel-in-progress: false
    steps:
      - name: Check out this repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/report-failure
        with:
          title: Automated build failed
          what-failed: The build of c2patool `${{ inputs.version }}` failed
          token: ${{ github.token }}
