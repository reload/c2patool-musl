# Keeps the scheduled workflows enabled.
#
# GitHub disables them after 60 days without a commit, and a release is a tag,
# not a commit. Upstream can go quiet for longer than that. This commits when
# the last commit is over 45 days old.
#
# Permissions: contents: write to push. issues: write, because a keepalive that
# fails in silence defeats itself.

name: Keepalive

on:
  schedule:
    - cron: "25 5 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  keepalive:
    name: Commit when the repository is quiet
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # Keeps its credentials on purpose: this job pushes. It uploads no
      # artifacts, so the credential cannot leave the runner.
      - name: Check out this repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked]

      - name: Write a commit when the last commit is old
        run: |
          set -euo pipefail
          MAX_QUIET_DAYS=45
          LAST="$(git log -1 --format=%ct)"
          DAYS=$(( ( $(date +%s) - LAST ) / 86400 ))
          echo "The last commit is ${DAYS} days old. The limit is ${MAX_QUIET_DAYS} days."

          if [ "$DAYS" -lt "$MAX_QUIET_DAYS" ]; then
            echo "The repository is active. No commit is needed."
            exit 0
          fi

          date -u +'%Y-%m-%dT%H:%M:%SZ' > .github/keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive
          git commit -m "Update the keepalive timestamp"
          git push
          echo "Pushed a keepalive commit. The scheduled workflows stay enabled."

  report-failure:
    name: Report the failure
    needs: keepalive
    if: failure() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    concurrency:
      group: report-failure
      cancel-in-progress: false
    steps:
      - name: Check out this repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/report-failure
        with:
          title: The keepalive failed
          what-failed: >-
            The keepalive failed. The scheduled workflows will be disabled after
            60 days without a commit
          token: ${{ github.token }}
