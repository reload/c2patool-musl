# Checks the workflows and the scripts on every push.
#
# The workflows and the scripts are the product of this repository, so a shell
# mistake in them is a real defect. This job finds one in seconds, instead of
# after a ten minute build.
#
# Permissions: contents: read.

name: Lint

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Check the workflows and the scripts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out this repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Both linters run from a pinned image, so this repository depends on no
      # third party GitHub action.
      - name: Check the workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color

      - name: Check the scripts
        run: docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:v0.11.0 -S warning scripts/*.sh
