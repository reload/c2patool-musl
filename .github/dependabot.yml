# Watches the actions pinned in .github/workflows. It cannot see the images the
# workflows pull with docker run, so bump those by hand.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Do not adopt a release on its first day.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "Update"
